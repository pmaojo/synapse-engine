[package]
name = "synapse-core"
version = "1.0.0"
edition.workspace = true
description = "The Symbolic AGI Memory Core (Pure Graph, No Vectors)"
readme = "README.md"
repository = "https://github.com/pmaojo/synapse-engine"
license = "MIT"
keywords = ["semantic", "graph", "agi", "knowledge"]
categories = ["database", "science"]

[[bin]]
name = "synapse"
path = "src/main.rs"

[dependencies]
# The Core Logic Engine
oxigraph = { version = "0.4", features = ["rocksdb"] }
oxrdf = "0.2"

# Async & Runtime
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# We will use axum/SSE directly since the Rust MCP ecosystem is still young and fragmented.
# Using standard HTTP and stdio for MCP Server implementation.

# Serialization & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Markdown Extended Parsing
markdown = "1.0.0-alpha.17" # wooorm/markdown-rs for AST parsing
yaml-front-matter = "0.1.0" # To extract YAML strictly

# Utilities (Hashing for Provenance, File Watching)
sha2 = "0.10"
hex = "0.4"
notify = "6.1" # For watching directories
walkdir = "2.4" # For recursive directory reading

# Error Handling & Logging
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# Common Types and Data Structures
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
regex = "1.10"
dashmap = "5.5"
csv = "1.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonschema = "0.18"
urlencoding = "2.1.3"
serde_yaml = "0.9.34"
tokio-stream = "0.1.18"
futures = "0.3.32"
